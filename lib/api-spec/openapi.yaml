          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    PaginatedAdminUsers:
      type: object
      required: [users, total, page, limit, totalPages]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserDetail"
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number

    AdminUpdateUserRequest:
      type: object
