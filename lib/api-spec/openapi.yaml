# ─── COMPONENTS ───────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string

    # ─── AUTH ───────────────────────────────────────────────────
    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    GoogleAuthInput:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UploadAvatarInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    UpdateFcmTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
        platform:
          type: string
          enum: [android, ios, web]

    UpdateExchangeRateInput:
      type: object
      required: [rate]
      properties:
        rate:
          type: number
        base:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, name, currencyCode]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        currencyCode:
          type: string
          example: USD
        country:
          type: string
        phone:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    # ─── USERS ──────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, name, currencyCode, role, isActive, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        currencyCode:
          type: string
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        subscription:
          $ref: "#/components/schemas/UserSubscriptionBrief"
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserSubscriptionBrief:
      type: object
      required: [planName, status, expiresAt]
      properties:
        planName:
          type: string
        status:
          type: string
          enum: [trial, active, cancelled, expired]
        expiresAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        country:
          type: string
        currencyCode:
          type: string

    # ─── DASHBOARD ──────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalBalance, totalIncome, totalExpense, netBalance, currency, accountCount, transactionCount]
      properties:
        totalBalance:
          type: number
        totalIncome:
          type: number
        totalExpense:
          type: number
        netBalance:
          type: number
        currency:
          type: string
        accountCount:
          type: number
        transactionCount:
          type: number
        incomeChange:
          type: number
          description: Percentage change from previous period
        expenseChange:
          type: number
          description: Percentage change from previous period

    ChartData:
      type: object
      required: [labels, income, expenses]
      properties:
        labels:
          type: array
          items:
            type: string
        income:
          type: array
          items:
            type: number
        expenses:
          type: array
          items:
            type: number
        currency:
          type: string

    CategoryBreakdown:
      type: object
      required: [items, total, currency]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdownItem"
        total:
          type: number
        currency:
          type: string

    CategoryBreakdownItem:
      type: object
      required: [categoryId, categoryName, categoryIcon, categoryColor, amount, percentage]
      properties:
        categoryId:
          type: string
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        amount:
          type: number
        percentage:
          type: number

    # ─── ACCOUNTS ───────────────────────────────────────────────
    Account:
      type: object
      required: [id, name, type, currencyCode, balance, isActive, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [cash, bank, card, savings, investment, other]
        currencyCode:
          type: string
        balance:
          type: number
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        bankName:
          type: string
          nullable: true
        accountNumber:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AccountSummary:
      type: object
      required: [account, transactions, balanceHistory]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        balanceHistory:
          type: array
          items:
            type: object
            required: [date, balance]
            properties:
              date:
                type: string
              balance:
                type: number

    CreateAccountRequest:
      type: object
      required: [name, type, currencyCode, balance]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cash, bank, card, savings, investment, other]
        currencyCode:
          type: string
        balance:
          type: number
        color:
          type: string
        icon:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string

    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cash, bank, card, savings, investment, other]
        currencyCode:
          type: string
        color:
          type: string
        icon:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        isActive:
          type: boolean

    # ─── TRANSACTIONS ─────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, type, amount, currencyCode, accountId, categoryId, date, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          type: number
        currencyCode:
          type: string
        exchangeRate:
          type: number
          nullable: true
        accountId:
          type: string
        account:
          $ref: "#/components/schemas/Account"
          nullable: true
        categoryId:
          type: string
        category:
          $ref: "#/components/schemas/Category"
          nullable: true
        description:
          type: string
          nullable: true
        receiptUrl:
          type: string
          nullable: true
        transferToAccountId:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PaginatedTransactions:
      type: object
      required: [transactions, total, page, limit, totalPages]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number

    CreateTransactionRequest:
      type: object
      required: [type, amount, currencyCode, accountId, categoryId, date]
      properties:
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
        currencyCode:
          type: string
        accountId:
          type: string
        categoryId:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        receiptUrl:
          type: string

    UpdateTransactionRequest:
      type: object
      properties:
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
        currencyCode:
          type: string
        accountId:
          type: string
        categoryId:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        receiptUrl:
          type: string

    CreateTransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amount, currencyCode, date]
      properties:
        fromAccountId:
          type: string
        toAccountId:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time

    # ─── CATEGORIES ───────────────────────────────────────────────
    Category:
      type: object
      required: [id, name, type, icon, color, isDefault]
      properties:
        id:
          type: string
        name:
          type: string
        nameAr:
          type: string
          nullable: true
        type:
          type: string
          enum: [income, expense, both]
        icon:
          type: string
        color:
          type: string
        isDefault:
          type: boolean
        parentId:
          type: string
          nullable: true

    CreateCategoryRequest:
      type: object
      required: [name, type, icon, color]
      properties:
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, both]
        icon:
          type: string
        color:
          type: string
        parentId:
          type: string

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        nameAr:
          type: string
        icon:
          type: string
        color:
          type: string

    # ─── CURRENCIES ───────────────────────────────────────────────
    Currency:
      type: object
      required: [id, code, name, symbol, isActive]
      properties:
        id:
          type: string
        code:
          type: string
          example: USD
        name:
          type: string
        nameAr:
          type: string
          nullable: true
        symbol:
          type: string
        flag:
          type: string
          nullable: true
        rateToUsd:
          type: number
          nullable: true
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ExchangeRates:
      type: object
      required: [base, rates, updatedAt]
      properties:
        base:
          type: string
        rates:
          type: object
          additionalProperties:
            type: number
        updatedAt:
          type: string
          format: date-time

    ConversionResult:
      type: object
      required: [from, to, amount, convertedAmount, rate]
      properties:
        from:
          type: string
        to:
          type: string
        amount:
          type: number
        convertedAmount:
          type: number
        rate:
          type: number

    CreateCurrencyRequest:
      type: object
      required: [code, name, symbol]
      properties:
        code:
          type: string
        name:
          type: string
        nameAr:
          type: string
        symbol:
          type: string
        flag:
          type: string
        rateToUsd:
          type: number

    # ─── BUDGETS ─────────────────────────────────────────────────
    Budget:
      type: object
      required: [id, categoryId, amount, currencyCode, month, year, spent, remaining]
      properties:
        id:
          type: string
        categoryId:
          type: string
        category:
          $ref: "#/components/schemas/Category"
          nullable: true
        amount:
          type: number
        currencyCode:
          type: string
        month:
          type: number
        year:
          type: number
        spent:
          type: number
        remaining:
          type: number
        percentage:
          type: number
        alertThreshold:
          type: number
          nullable: true

    BudgetOverview:
      type: object
      required: [totalBudget, totalSpent, totalRemaining, budgets, currency]
      properties:
        totalBudget:
          type: number
        totalSpent:
          type: number
        totalRemaining:
          type: number
        currency:
          type: string
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/Budget"

    CreateBudgetRequest:
      type: object
      required: [categoryId, amount, currencyCode, month, year]
      properties:
        categoryId:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        month:
          type: number
        year:
          type: number
        alertThreshold:
          type: number

    UpdateBudgetRequest:
      type: object
      properties:
        amount:
          type: number
        alertThreshold:
          type: number

    # ─── REPORTS ─────────────────────────────────────────────────
    MonthlyReport:
      type: object
      required: [month, year, currency, totalIncome, totalExpense, netBalance, byCategory, byAccount, dailyData]
      properties:
        month:
          type: number
        year:
          type: number
        currency:
          type: string
        totalIncome:
          type: number
        totalExpense:
          type: number
        netBalance:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdownItem"
        byAccount:
          type: array
          items:
            type: object
            required: [accountId, accountName, income, expense, balance]
            properties:
              accountId:
                type: string
              accountName:
                type: string
              income:
                type: number
              expense:
                type: number
              balance:
                type: number
        dailyData:
          type: array
          items:
            type: object
            required: [date, income, expense]
            properties:
              date:
                type: string
              income:
                type: number
              expense:
                type: number

    AnnualReport:
      type: object
      required: [year, currency, totalIncome, totalExpense, netBalance, monthlyData, topCategories]
      properties:
        year:
          type: number
        currency:
          type: string
        totalIncome:
          type: number
        totalExpense:
          type: number
        netBalance:
          type: number
        monthlyData:
          type: array
          items:
            type: object
            required: [month, income, expense]
            properties:
              month:
                type: number
              income:
                type: number
              expense:
                type: number
        topCategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdownItem"

    CategoryReport:
      type: object
      required: [startDate, endDate, type, currency, categories]
      properties:
        startDate:
          type: string
        endDate:
          type: string
        type:
          type: string
        currency:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdownItem"

    ExportReportRequest:
      type: object
      required: [type, startDate, endDate]
      properties:
        type:
          type: string
          enum: [monthly, annual, category, custom]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        currency:
          type: string
        includeCharts:
          type: boolean

    # ─── SUBSCRIPTIONS & PLANS ────────────────────────────────────
    Plan:
      type: object
      required: [id, name, price, currency, interval, transactionLimit, features, isActive]
      properties:
        id:
          type: string
        name:
          type: string
        nameAr:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        price:
          type: number
        currency:
          type: string
        interval:
          type: string
          enum: [monthly, yearly, lifetime]
        transactionLimit:
          type: number
          nullable: true
          description: null means unlimited
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        isFree:
          type: boolean
        trialDays:
          type: number
          nullable: true
        googlePlayProductId:
          type: string
          nullable: true
        appleProductId:
          type: string
          nullable: true

    UserSubscription:
      type: object
      required: [id, planId, plan, status, startDate, expiresAt]
      properties:
        id:
          type: string
        planId:
          type: string
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [trial, active, cancelled, expired]
        startDate:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        autoRenew:
          type: boolean

    SubscribeRequest:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
        paymentToken:
          type: string
        platform:
          type: string
          enum: [web, android, ios]

    SubscriptionUsage:
      type: object
      required: [used, limit, percentage, canAdd]
      properties:
        used:
          type: number
        limit:
          type: number
          nullable: true
        percentage:
          type: number
        canAdd:
          type: boolean
        planName:
          type: string

    CreatePlanRequest:
      type: object
      required: [name, price, currency, interval, features]
      properties:
        name:
          type: string
        nameAr:
          type: string
        description:
          type: string
        price:
          type: number
        currency:
          type: string
        interval:
          type: string
          enum: [monthly, yearly, lifetime]
        transactionLimit:
          type: number
        features:
          type: array
          items:
            type: string
        isFree:
          type: boolean
        trialDays:
          type: number
        googlePlayProductId:
          type: string
        appleProductId:
          type: string

    UpdatePlanRequest:
      type: object
      properties:
        name:
          type: string
        nameAr:
          type: string
        description:
          type: string
        price:
          type: number
        transactionLimit:
          type: number
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    # ─── PAYMENTS ─────────────────────────────────────────────────
    PaymentRecord:
      type: object
      required: [id, userId, planId, amount, currency, status, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        planId:
          type: string
        plan:
          $ref: "#/components/schemas/Plan"
          nullable: true
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        platform:
          type: string
          enum: [web, android, ios]
          nullable: true
        transactionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    PaginatedPayments:
      type: object
      required: [payments, total, page, limit, totalPages]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRecord"
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number

    VerifyPaymentRequest:
      type: object
      required: [platform, purchaseToken, productId]
      properties:
        platform:
          type: string
          enum: [android, ios]
        purchaseToken:
          type: string
        productId:
          type: string
        planId:
          type: string

    # ─── NOTIFICATIONS ────────────────────────────────────────────
    Notification:
      type: object
      required: [id, title, body, type, isRead, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [budget_alert, subscription, system, transaction, backup]
        isRead:
          type: boolean
        data:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    PaginatedNotifications:
      type: object
      required: [notifications, total, page, limit, totalPages, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number
        unreadCount:
          type: number

    SendNotificationRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        targetUsers:
          type: string
          enum: [all, subscribed, trial, free]
        userIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum: [budget_alert, subscription, system, transaction, backup]

    # ─── BACKUPS ─────────────────────────────────────────────────
    Backup:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        fileSize:
          type: number
          nullable: true
        googleDriveId:
          type: string
          nullable: true
        encrypted:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ─── SETTINGS ────────────────────────────────────────────────
    UserSettings:
      type: object
      required: [id, userId, theme, language, currencyCode, dateFormat, notificationsEnabled]
      properties:
        id:
          type: string
        userId:
          type: string
        theme:
          type: string
          enum: [light, dark, system]
        language:
          type: string
          enum: [ar, en]
        currencyCode:
          type: string
        dateFormat:
          type: string
        numberFormat:
          type: string
        notificationsEnabled:
          type: boolean
        budgetAlerts:
          type: boolean
        weeklyReport:
          type: boolean
        backupEnabled:
          type: boolean
        backupFrequency:
          type: string
          enum: [daily, weekly, monthly]

    UpdateSettingsRequest:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        language:
          type: string
          enum: [ar, en]
        currencyCode:
          type: string
        dateFormat:
          type: string
        numberFormat:
          type: string
        notificationsEnabled:
          type: boolean
        budgetAlerts:
          type: boolean
        weeklyReport:
          type: boolean
        backupEnabled:
          type: boolean
        backupFrequency:
          type: string
          enum: [daily, weekly, monthly]

