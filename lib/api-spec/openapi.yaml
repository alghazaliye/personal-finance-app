        freeTransactionLimit:
          type: number
        maintenanceMode:
          type: boolean
        registrationEnabled:
          type: boolean
        defaultCurrency:
          type: string
        defaultLanguage:
          type: string
          enum: [ar, en]

    UpdateSystemSettingsRequest:
      type: object
      properties:
        appName:
          type: string
        appNameAr:
          type: string
        supportEmail:
