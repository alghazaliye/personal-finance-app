            properties:
              id:
                type: string
              userId:
                type: string
              userName:
                type: string
              userEmail:
                type: string
              planName:
                type: string
              status:
                type: string
                enum: [trial, active, cancelled, expired]
              startDate:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              amount:
                type: number
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number

    SystemSettings:
